name: build

on:
  push:
    branches: [main]
  pull_request:
  # So the build can be smoke-tested on a branch without opening a pull request.
  workflow_dispatch:

# A superseded run on the same branch is wasted minutes and a confusing red cross
# on a commit that has already been replaced.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Restore, build, test
    # Windows-first: the device layer is WASAPI and there is nowhere else to run it.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up the SDK
        uses: actions/setup-dotnet@v5
        with:
          # Pinned by the same file the developers use, so CI cannot drift onto a
          # different SDK than the one the build was verified against.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Not --no-restore: Vam.Client is MAUI, and its Windows RuntimeIdentifier is only
      # injected during build, so the win-x64 runtime pack is not there after a plain
      # restore. The build has to be allowed to fetch it.
      - name: Build
        run: dotnet build --configuration Release

      # An engine outlives the console and holds its own output open. Building the console
      # with one running must still work (#61), so hold the engine open and touch what it
      # copies, then build the console.
      - name: Build the console while an engine is running
        shell: pwsh
        run: |
          $output = (Get-ChildItem src/Vam.Server/bin/Release -Recurse -Filter Vam.Server.dll | Select-Object -First 1).Directory
          (Get-Item src/Vam.Engine/Devices/DeviceRegistry.cs).LastWriteTime = Get-Date
          $locks = Get-ChildItem $output -File |
            Where-Object { $_.Name -like 'Vam.*' -and $_.Extension -in '.dll', '.exe' } |
            ForEach-Object { [IO.File]::Open($_.FullName, 'Open', 'Read', 'Read') }
          try {
            dotnet build src/Vam.Client --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            $locks | ForEach-Object { $_.Dispose() }
          }

      # Long-running tests are excluded by default through VAM_LONGRUNNING, which is
      # not set here. See CONTRIBUTING.md.
      - name: Test
        shell: pwsh
        run: |
          dotnet test --no-build --configuration Release 2>&1 | Tee-Object -FilePath test-output.txt
          exit $LASTEXITCODE

      # An allocation failure has to be readable without expanding anything. Annotations
      # appear at the top of the run page, and the summary is the first thing on it.
      - name: Surface allocation failures
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path test-output.txt)) { exit 0 }

          $rule = 'allocates, locks or waits'
          $hits = Select-String -Path test-output.txt -SimpleMatch -Pattern $rule -Context 2, 0

          if (-not $hits) { exit 0 }

          Write-Output "::error title=Audio-path allocation::Code in the audio path allocated. Nothing in the audio path allocates, locks or waits - see docs/audio-path.md"

          $summary = @()
          $summary += '## Audio-path allocation'
          $summary += ''
          $summary += 'The allocation gate fired. Nothing in the audio path allocates, locks or waits.'
          $summary += 'The boundary is defined in [docs/audio-path.md](docs/audio-path.md).'
          $summary += ''
          $summary += '```'
          foreach ($hit in $hits) {
            foreach ($line in $hit.Context.PreContext) { $summary += $line.TrimEnd() }
            $summary += $hit.Line.TrimEnd()
            $summary += ''
          }
          $summary += '```'
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
