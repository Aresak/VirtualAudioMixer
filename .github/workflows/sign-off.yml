name: sign-off

# Pull requests only. There is no CLA, so the sign-off is the only record that a
# change was offered under the file's licence - and unenforced it will be missing
# exactly when it matters.
on:
  pull_request:

concurrency:
  group: sign-off-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sign-off:
    name: Every commit signed off
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Signed-off-by
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          unsigned=0
          count=0

          while read -r sha; do
            count=$((count + 1))
            subject=$(git log -1 --format='%s' "$sha")

            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit ${sha} is not signed off: ${subject}"
              unsigned=$((unsigned + 1))
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "$unsigned" -eq 0 ]; then
            echo "All ${count} commit(s) signed off."
            exit 0
          fi

          {
            echo '## Missing sign-off'
            echo
            echo "${unsigned} of ${count} commit(s) have no \`Signed-off-by\` line."
            echo 'There is no CLA here, so this line is the only record that the change was'
            echo "offered under the file's licence."
            echo
            echo 'Fix the most recent commit:'
            echo
            echo '```'
            echo 'git commit --amend -s'
            echo '```'
            echo
            echo 'Fix several, from the branch point:'
            echo
            echo '```'
            echo "git rebase --signoff ${BASE_SHA}"
            echo '```'
            echo
            echo 'Then force-push the branch.'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      # Not in VAM-007's scope, and added anyway: a forbidden Co-Authored-By line
      # reached main through a reviewed pull request, which is precisely the failure
      # an unenforced rule produces. Same job because it is the same kind of check
      # against the same commit range.
      - name: Check for AI attribution
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          offending=0

          while read -r sha; do
            subject=$(git log -1 --format='%s' "$sha")

            if git log -1 --format='%B' "$sha" | grep -qiE 'co-authored-by:.*(claude|copilot|chatgpt|gpt-|gemini|anthropic|openai)|generated with|created with .*(claude|copilot)|🤖'; then
              echo "::error::Commit ${sha} mentions an AI tool: ${subject}"
              offending=$((offending + 1))
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "$offending" -eq 0 ]; then
            exit 0
          fi

          {
            echo '## AI attribution in a commit message'
            echo
            echo "AGENTS.md: no AI attribution of any kind. No \`Co-Authored-By\` for a tool,"
            echo 'no "generated with", nothing.'
            echo
            echo 'Rewrite the message:'
            echo
            echo '```'
            echo 'git commit --amend'
            echo '```'
            echo
            echo 'Or, for several:'
            echo
            echo '```'
            echo "git rebase -i ${BASE_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
